title: "Ujjwal Kanth"
email: uknth@outlook.com
description: >-
  Personal notes, ramblings and occasional opinions.
baseurl: ""
url: "https://uknth.me"

theme: jekyll-theme-minimal

logo: "https://github.com/uknth.png"

author: Ujjwal Kanth

excerpt_separator: <!--more-->

# Navigation pages (order matters)
header_pages:
  - posts/index.html
  - work.md

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

paginate: 10
paginate_path: "/posts/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - .bundle
  - vendor
  - cliff.toml
  - CHANGELOG.md
